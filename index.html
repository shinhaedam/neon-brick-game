<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>네온 브레이크아웃 - 극한의 벽돌깨기</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: radial-gradient(circle at 50% 30%, #151828, #0a0b12 80%);
      color: #fff;
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #gameContainer {
      position: relative;
      width: min(96vw, 560px);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .stat-box {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #8f9cae;
      font-weight: 600;
    }

    .stat-value {
      font-size: 17px;
      font-weight: 800;
      color: #00f2fe;
      text-shadow: 0 0 10px rgba(0, 242, 254, 0.4);
    }

    .lives-badge {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 14px;
      font-weight: 800;
      color: #ff3366;
    }

    /* 상단 버프 상태 표시 바 */
    #buffBar {
      width: 100%;
      display: flex;
      gap: 8px;
      justify-content: center;
      min-height: 24px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }

    .buff-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      animation: pulse 1.5s infinite;
      box-shadow: 0 0 10px currentColor;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    #canvasWrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid rgba(0, 242, 254, 0.3);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 30px rgba(0, 242, 254, 0.15);
      background: #080a13;
    }

    canvas {
      display: block;
      cursor: none;
    }

    /* 오버레이 (시작, 게임오버, 클리어 화면) */
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 12, 20, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 20;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h1 {
      font-size: 30px;
      font-weight: 900;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      letter-spacing: 1px;
    }

    .overlay.gameover h1 {
      background: linear-gradient(135deg, #ff4b4b 0%, #ff8585 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay.clear h1 {
      background: linear-gradient(135deg, #00ff87 0%, #60efff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .overlay p {
      color: #b3c2d4;
      font-size: 13.5px;
      text-align: center;
      max-width: 85%;
      line-height: 1.6;
    }

    .overlay .final-score {
      font-size: 20px;
      font-weight: bold;
      color: #fff;
    }

    .btn {
      padding: 12px 34px;
      border: none;
      outline: none;
      background: linear-gradient(135deg, #00f2fe, #4facfe);
      color: #050811;
      font-weight: 800;
      font-size: 15px;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 242, 254, 0.4);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .btn:hover {
      transform: scale(1.06);
      box-shadow: 0 6px 22px rgba(0, 242, 254, 0.6);
    }

    .btn:active {
      transform: scale(0.96);
    }

    .tips {
      margin-top: 10px;
      font-size: 12px;
      color: #63738a;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <header>
      <div class="stat-box">
        <span class="stat-label">남은 벽돌</span>
        <span class="stat-value" id="bricksCountText">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">점수</span>
        <span class="stat-value" id="scoreText">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">최고점수</span>
        <span class="stat-value" id="highScoreText">0</span>
      </div>
      <div class="stat-box">
        <span class="stat-label">목숨</span>
        <div class="lives-badge" id="livesContainer">❤️ 1 (원라이프)</div>
      </div>
    </header>

    <!-- 현재 적용 중인 버프 표시 -->
    <div id="buffBar"></div>

    <div id="canvasWrapper">
      <canvas id="gameCanvas" width="540" height="660"></canvas>

      <!-- 시작 / 오버레이 -->
      <div id="overlay" class="overlay active">
        <h1 id="overlayTitle">SUPER BRICK BLASTER</h1>
        <p id="overlayDesc">
          단 <strong>1개의 목숨</strong>으로 <strong>초대형 블록 진형</strong>을 돌파하세요!<br>
          파괴 불가능한 <strong>철갑 블록(실버 메탈)</strong>을 전략적으로 우회하고 모든 색상 블록을 파괴하면 승리합니다!<br>
          벽돌을 깨면 <strong>관통 레이저볼, 안전 쉴드 바닥, 5갈래 멀티볼, 거대 패들</strong> 등 강력한 버프 아이템이 쏟아집니다!
        </p>
        <div id="overlayScore" class="final-score" style="display:none;"></div>
        <button id="startBtn" class="btn">도전 시작</button>
      </div>
    </div>

    <div class="tips">
      조작: 마우스/터치 좌우 이동 | 클릭 또는 스페이스바: 발사
    </div>
  </div>

  <script>
    // --- 오디오 효과음 (Web Audio API) ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playTone(freq, type = 'sine', duration = 0.08, gainVal = 0.15) {
        if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch(e) {}
      }
      metalHit() {
        this.playTone(850, 'square', 0.05, 0.22);
      }
      paddleHit() {
        this.playTone(340, 'triangle', 0.07, 0.2);
      }
      brickHit(isPenetrate = false) {
        if (isPenetrate) {
          this.playTone(700, 'square', 0.04, 0.12);
        } else {
          this.playTone(450 + Math.random() * 200, 'sine', 0.06, 0.15);
        }
      }
      powerup() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(1000, now + 0.2);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.2);
      }
      loseLife() {
        this.playTone(120, 'sawtooth', 0.4, 0.3);
      }
      shieldBounce() {
        this.playTone(600, 'sine', 0.15, 0.25);
      }
      gameClear() {
        [523, 659, 783, 1046, 1318].forEach((f, i) => {
          setTimeout(() => this.playTone(f, 'triangle', 0.2, 0.2), i * 120);
        });
      }
    }

    const sound = new SoundEngine();

    // --- 기본 요소 및 상태 ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const overlayScore = document.getElementById('overlayScore');
    const startBtn = document.getElementById('startBtn');

    const bricksCountText = document.getElementById('bricksCountText');
    const scoreText = document.getElementById('scoreText');
    const highScoreText = document.getElementById('highScoreText');
    const buffBar = document.getElementById('buffBar');

    let gameState = 'START';
    let score = 0;
    let highScore = localStorage.getItem('brick_high') || 0;
    let lives = 1; // 단 1개의 목숨!

    highScoreText.textContent = highScore;

    // 패들
    const paddle = {
      baseWidth: 100,
      width: 100,
      height: 13,
      x: 220,
      y: 620,
      color: '#00f2fe'
    };

    // 버프 타이머 상태들
    let buffs = {
      fireball: 0,      // 관통 파이어볼 남은 시간 (초)
      giantPaddle: 0,   // 거대 패들 남은 시간
      shield: 0,        // 바닥 안전 쉴드 남은 횟수 (1~3회 방어)
      slowMotion: 0     // 공 감속 버프
    };

    let balls = [];
    let bricks = [];
    let particles = [];
    let items = [];

    // 대규모 10배 벽돌 생성 (기존 30개 수준 -> 약 360여 개)
    const colorSpectrum = [
      { fill: '#ff0055', glow: 'rgba(255, 0, 85, 0.6)', pts: 10 },
      { fill: '#ff5500', glow: 'rgba(255, 85, 0, 0.6)', pts: 10 },
      { fill: '#ffaa00', glow: 'rgba(255, 170, 0, 0.6)', pts: 10 },
      { fill: '#ffd200', glow: 'rgba(255, 210, 0, 0.6)', pts: 10 },
      { fill: '#a6ff00', glow: 'rgba(166, 255, 0, 0.6)', pts: 10 },
      { fill: '#00ff87', glow: 'rgba(0, 255, 135, 0.6)', pts: 10 },
      { fill: '#00f2fe', glow: 'rgba(0, 242, 254, 0.6)', pts: 10 },
      { fill: '#4facfe', glow: 'rgba(79, 172, 254, 0.6)', pts: 10 },
      { fill: '#9b51e0', glow: 'rgba(155, 81, 224, 0.6)', pts: 10 },
      { fill: '#ff3399', glow: 'rgba(255, 51, 153, 0.6)', pts: 10 }
    ];

    function initMegaBricks() {
      bricks = [];
      const cols = 40; // 가로 40개
      const rows = 30; // 세로 30단 = 총 1,200개 블록
      const padding = 1.5;
      const offsetX = 8;
      const offsetY = 25;
      const brickWidth = (canvas.width - offsetX * 2 - (cols - 1) * padding) / cols;
      const brickHeight = 9;

      for (let r = 0; r < rows; r++) {
        const colorInfo = colorSpectrum[r % colorSpectrum.length];
        for (let c = 0; c < cols; c++) {
          // 안 깨지는 단단한 메탈/강철 블록 배치 (약 8% 비율로 체스판/필러 패턴 배치)
          // 최상단/최하단/특정 열들을 가로막아 전략적 반사각을 유도하되, 완전히 막히지 않도록 길을 열어둠
          const isIndestructible = (
            (r === 7 || r === 15 || r === 22) && (c % 4 === 1 || c % 4 === 2)
          ) || (
            (c === 10 || c === 20 || c === 30) && (r % 6 === 2 || r % 6 === 3)
          );

          if (isIndestructible) {
            bricks.push({
              x: offsetX + c * (brickWidth + padding),
              y: offsetY + r * (brickHeight + padding),
              w: brickWidth,
              h: brickHeight,
              color: '#495b70',
              borderColor: '#b4c7dc',
              glow: 'rgba(180, 199, 220, 0.4)',
              unbreakable: true,
              pts: 0
            });
          } else {
            bricks.push({
              x: offsetX + c * (brickWidth + padding),
              y: offsetY + r * (brickHeight + padding),
              w: brickWidth,
              h: brickHeight,
              color: colorInfo.fill,
              glow: colorInfo.glow,
              unbreakable: false,
              pts: 10
            });
          }
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.width = paddle.baseWidth;
      paddle.x = (canvas.width - paddle.width) / 2;

      balls = [{
        x: canvas.width / 2,
        y: paddle.y - 10,
        radius: 5.5,
        dx: (Math.random() > 0.5 ? 1 : -1) * 3.8,
        dy: -4.8,
        stuck: true
      }];

      items = [];
    }

    function spawnParticles(x, y, color, count = 8) {
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3.5 + 1.2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2 + 1,
          color: color,
          alpha: 1,
          decay: Math.random() * 0.035 + 0.025
        });
      }
    }

    // 다양한 5대 버프 아이템 정의
    const BUFF_TYPES = [
      { id: 'PENETRATE', label: '🔥 레이저 관통볼', icon: '🔥', color: '#ff3300', bg: 'rgba(255, 51, 0, 0.2)' },
      { id: 'MULTIBALL', label: '⚡ 5멀티볼', icon: '⚡', color: '#ffd200', bg: 'rgba(255, 210, 0, 0.2)' },
      { id: 'GIANT', label: '↔️ 거대 패들', icon: '↔️', color: '#00ff87', bg: 'rgba(0, 255, 135, 0.2)' },
      { id: 'SHIELD', label: '🛡️ 바닥 안전막', icon: '🛡️', color: '#00f2fe', bg: 'rgba(0, 242, 254, 0.2)' },
      { id: 'BOMB', label: '💣 대폭발', icon: '💣', color: '#ff0077', bg: 'rgba(255, 0, 119, 0.2)' }
    ];

    function spawnItem(x, y) {
      // 1,200개 블록이므로 드롭률 10% (약 120여 개 아이템이 지속적으로 드롭됨)
      if (Math.random() > 0.10) return;

      const pick = BUFF_TYPES[Math.floor(Math.random() * BUFF_TYPES.length)];

      items.push({
        x: x,
        y: y,
        info: pick,
        radius: 11,
        vy: 2.3
      });
    }

    function applyBuff(itemInfo, itemX, itemY) {
      sound.powerup();

      switch (itemInfo.id) {
        case 'PENETRATE':
          buffs.fireball = 10; // 10초간 관통
          break;

        case 'MULTIBALL':
          // 현재 볼 각각에서 3개씩 분기 생성 (최대 25개 볼 제한)
          const baseBalls = [...balls];
          baseBalls.forEach(b => {
            if (balls.length >= 25) return;
            for (let k = 0; k < 3; k++) {
              const spreadAngle = (Math.random() - 0.5) * 1.5;
              const spd = Math.hypot(b.dx, b.dy);
              balls.push({
                x: b.x,
                y: b.y,
                radius: 5,
                dx: Math.sin(spreadAngle) * spd,
                dy: -Math.abs(Math.cos(spreadAngle) * spd),
                stuck: false
              });
            }
          });
          break;

        case 'GIANT':
          buffs.giantPaddle = 12; // 12초간 거대 패들
          paddle.width = 175;
          break;

        case 'SHIELD':
          buffs.shield = Math.min(3, buffs.shield + 1); // 최대 3회 바닥 튕겨냄 보호막
          break;

        case 'BOMB':
          // 반경 75px 내의 일반 벽돌 폭발 (안 깨지는 블록은 제외)
          for (let i = bricks.length - 1; i >= 0; i--) {
            const br = bricks[i];
            if (br.unbreakable) continue;
            const dist = Math.hypot(br.x + br.w / 2 - itemX, br.y + br.h / 2 - itemY);
            if (dist < 75) {
              score += br.pts;
              spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, 8);
              bricks.splice(i, 1);
            }
          }
          break;
      }

      updateBuffBar();
      updateUI();
    }

    function updateBuffBar() {
      buffBar.innerHTML = '';

      if (buffs.fireball > 0) {
        buffBar.innerHTML += `<span class="buff-badge" style="color:#ff3300; background:rgba(255,51,0,0.25); border:1px solid #ff3300;">🔥 관통볼 ${Math.ceil(buffs.fireball)}s</span>`;
      }
      if (buffs.giantPaddle > 0) {
        buffBar.innerHTML += `<span class="buff-badge" style="color:#00ff87; background:rgba(0,255,135,0.25); border:1px solid #00ff87;">↔️ 와이드패들 ${Math.ceil(buffs.giantPaddle)}s</span>`;
      }
      if (buffs.shield > 0) {
        buffBar.innerHTML += `<span class="buff-badge" style="color:#00f2fe; background:rgba(0,242,254,0.25); border:1px solid #00f2fe;">🛡️ 바닥보호막 × ${buffs.shield}</span>`;
      }
    }

    function updateUI() {
      const breakableCount = bricks.filter(b => !b.unbreakable).length;
      bricksCountText.textContent = breakableCount;
      scoreText.textContent = score;
      highScoreText.textContent = highScore;
    }

    function startGame() {
      sound.init();
      score = 0;
      lives = 1;
      buffs = { fireball: 0, giantPaddle: 0, shield: 0 };
      gameState = 'PLAYING';
      overlay.classList.remove('active');
      initMegaBricks();
      resetBallAndPaddle();
      updateBuffBar();
      updateUI();
    }

    function gameClear() {
      gameState = 'CLEAR';
      sound.gameClear();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('brick_high', highScore);
      }
      updateUI();
      overlayTitle.textContent = 'MISSION COMPLETE!';
      overlayDesc.textContent = `경이롭습니다! 단 1개의 목숨으로 모든 벽돌을 완벽히 격파하셨습니다!`;
      overlayScore.style.display = 'block';
      overlayScore.textContent = `최종 점수: ${score}점`;
      startBtn.textContent = '다시 도전';
      overlay.className = 'overlay clear active';
    }

    function gameOver() {
      gameState = 'GAMEOVER';
      sound.loseLife();
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('brick_high', highScore);
      }
      updateUI();
      overlayTitle.textContent = 'GAME OVER';
      overlayDesc.textContent = `공을 놓쳤습니다! 단 하나의 기회가 끝났습니다.`;
      overlayScore.style.display = 'block';
      overlayScore.textContent = `최종 기록: 남은 벽돌 ${bricks.length}개 / ${score}점`;
      startBtn.textContent = '재도전하기';
      overlay.className = 'overlay gameover active';
    }

    // 마우스 / 터치 조작
    function setPaddlePosition(clientX) {
      const rect = canvas.getBoundingClientRect();
      const relativeX = clientX - rect.left;
      const scale = canvas.width / rect.width;
      const targetX = relativeX * scale - paddle.width / 2;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.width, targetX));

      balls.forEach(ball => {
        if (ball.stuck) {
          ball.x = paddle.x + paddle.width / 2;
        }
      });
    }

    window.addEventListener('mousemove', (e) => {
      if (gameState !== 'PLAYING') return;
      setPaddlePosition(e.clientX);
    });

    window.addEventListener('touchmove', (e) => {
      if (gameState !== 'PLAYING' || !e.touches[0]) return;
      setPaddlePosition(e.touches[0].clientX);
    }, { passive: true });

    function launchBall() {
      sound.init();
      balls.forEach(ball => {
        if (ball.stuck) {
          ball.stuck = false;
        }
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') launchBall();
      if (e.code === 'ArrowLeft') paddle.x = Math.max(0, paddle.x - 28);
      if (e.code === 'ArrowRight') paddle.x = Math.min(canvas.width - paddle.width, paddle.x + 28);
    });

    canvas.addEventListener('click', launchBall);
    startBtn.addEventListener('click', startGame);

    let lastTime = performance.now();

    // 메인 업데이트
    function update(dt) {
      if (gameState !== 'PLAYING') return;

      // 0. 버프 시간 감소
      let buffChanged = false;
      if (buffs.fireball > 0) {
        buffs.fireball = Math.max(0, buffs.fireball - dt);
        buffChanged = true;
      }
      if (buffs.giantPaddle > 0) {
        buffs.giantPaddle = Math.max(0, buffs.giantPaddle - dt);
        buffChanged = true;
        if (buffs.giantPaddle === 0) {
          paddle.width = paddle.baseWidth;
        }
      }
      if (buffChanged) updateBuffBar();

      const isFireball = buffs.fireball > 0;

      // 1. 볼 물리 & 충돌
      for (let i = balls.length - 1; i >= 0; i--) {
        const b = balls[i];
        if (b.stuck) continue;

        b.x += b.dx;
        b.y += b.dy;

        // 벽 충돌
        if (b.x - b.radius <= 0) {
          b.x = b.radius;
          b.dx = -b.dx;
          sound.paddleHit();
        } else if (b.x + b.radius >= canvas.width) {
          b.x = canvas.width - b.radius;
          b.dx = -b.dx;
          sound.paddleHit();
        }

        // 천장 충돌
        if (b.y - b.radius <= 0) {
          b.y = b.radius;
          b.dy = -b.dy;
          sound.paddleHit();
        }

        // 패들 충돌
        if (
          b.y + b.radius >= paddle.y &&
          b.y - b.radius <= paddle.y + paddle.height &&
          b.x >= paddle.x &&
          b.x <= paddle.x + paddle.width &&
          b.dy > 0
        ) {
          b.y = paddle.y - b.radius;
          const hitPos = (b.x - (paddle.x + paddle.width / 2)) / (paddle.width / 2);
          const maxAngle = Math.PI / 2.5;
          const angle = hitPos * maxAngle;
          const speed = Math.hypot(b.dx, b.dy);
          b.dx = speed * Math.sin(angle);
          b.dy = -speed * Math.cos(angle);

          sound.paddleHit();
          spawnParticles(b.x, paddle.y, '#00f2fe', 6);
        }

        // 벽돌 충돌 (공 주변 벽돌만 효율적으로 검사)
        const checkRange = b.radius + 15;
        for (let j = bricks.length - 1; j >= 0; j--) {
          const br = bricks[j];
          if (
            b.y + checkRange < br.y ||
            b.y - checkRange > br.y + br.h ||
            b.x + checkRange < br.x ||
            b.x - checkRange > br.x + br.w
          ) {
            continue;
          }

          if (
            b.x + b.radius > br.x &&
            b.x - b.radius < br.x + br.w &&
            b.y + b.radius > br.y &&
            b.y - b.radius < br.y + br.h
          ) {
            // 안 깨지는 블록인 경우: 항상 반사되고 파괴되지 않음 (관통볼도 튕겨냄)
            if (br.unbreakable) {
              const overlapLeft = (b.x + b.radius) - br.x;
              const overlapRight = (br.x + br.w) - (b.x - b.radius);
              const overlapTop = (b.y + b.radius) - br.y;
              const overlapBottom = (br.y + br.h) - (b.y - b.radius);

              const minOverlapX = Math.min(overlapLeft, overlapRight);
              const minOverlapY = Math.min(overlapTop, overlapBottom);

              if (minOverlapX < minOverlapY) {
                b.dx = -b.dx;
              } else {
                b.dy = -b.dy;
              }

              sound.metalHit();
              spawnParticles(b.x, b.y, '#b4c7dc', 4);
              break;
            }

            // 일반 파괴 가능한 블록인 경우:
            // 관통 모드가 아닐 때만 공 반사
            if (!isFireball) {
              const overlapLeft = (b.x + b.radius) - br.x;
              const overlapRight = (br.x + br.w) - (b.x - b.radius);
              const overlapTop = (b.y + b.radius) - br.y;
              const overlapBottom = (br.y + br.h) - (b.y - b.radius);

              const minOverlapX = Math.min(overlapLeft, overlapRight);
              const minOverlapY = Math.min(overlapTop, overlapBottom);

              if (minOverlapX < minOverlapY) {
                b.dx = -b.dx;
              } else {
                b.dy = -b.dy;
              }
            }

            sound.brickHit(isFireball);
            spawnParticles(br.x + br.w / 2, br.y + br.h / 2, br.color, isFireball ? 4 : 8);
            score += br.pts;
            spawnItem(br.x + br.w / 2, br.y + br.h / 2);
            bricks.splice(j, 1);
            updateUI();

            if (!isFireball) break; // 관통 시에는 연속 타격 유지
          }
        }

        // 바닥 추락 감지
        if (b.y - b.radius > canvas.height) {
          // 바닥 쉴드가 있는 경우 바닥에서 튕겨냄
          if (buffs.shield > 0) {
            buffs.shield--;
            b.y = canvas.height - b.radius - 8;
            b.dy = -Math.abs(b.dy);
            sound.shieldBounce();
            spawnParticles(b.x, canvas.height - 5, '#00f2fe', 16);
            updateBuffBar();
          } else {
            balls.splice(i, 1);
          }
        }
      }

      // 공이 하나도 없으면 (목숨 1개 즉시 종료)
      if (balls.length === 0) {
        gameOver();
        return;
      }

      // 파괴 가능한 벽돌 올클리어 판정 (안 깨지는 블록은 남아있어도 클리어!)
      const remainingBreakable = bricks.some(b => !b.unbreakable);
      if (!remainingBreakable) {
        gameClear();
        return;
      }

      // 2. 아이템 업데이트
      for (let i = items.length - 1; i >= 0; i--) {
        const item = items[i];
        item.y += item.vy;

        // 패들 접촉 판정
        if (
          item.y + item.radius >= paddle.y &&
          item.y - item.radius <= paddle.y + paddle.height &&
          item.x >= paddle.x &&
          item.x <= paddle.x + paddle.width
        ) {
          applyBuff(item.info, item.x, item.y);
          spawnParticles(item.x, item.y, item.info.color, 14);
          items.splice(i, 1);
          continue;
        }

        if (item.y > canvas.height + 20) {
          items.splice(i, 1);
        }
      }

      // 3. 파티클 업데이트
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) particles.splice(i, 1);
      }
    }

    // 렌더링
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 은은한 네온 그리드 배경
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.025)';
      ctx.lineWidth = 1;
      for (let x = 0; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, canvas.height);
        ctx.stroke();
      }
      for (let y = 0; y < canvas.height; y += 30) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(canvas.width, y);
        ctx.stroke();
      }

      // 바닥 쉴드 안전막 활성화 시 가드 라인 렌더링
      if (buffs.shield > 0) {
        ctx.save();
        ctx.strokeStyle = '#00f2fe';
        ctx.shadowColor = '#00f2fe';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 4;
        ctx.setLineDash([8, 6]);
        ctx.beginPath();
        ctx.moveTo(0, canvas.height - 4);
        ctx.lineTo(canvas.width, canvas.height - 4);
        ctx.stroke();
        ctx.restore();
      }

      // 벽돌 렌더링
      bricks.forEach(br => {
        if (br.unbreakable) {
          ctx.fillStyle = br.color;
          ctx.fillRect(br.x, br.y, br.w, br.h);
          ctx.strokeStyle = br.borderColor;
          ctx.lineWidth = 1;
          ctx.strokeRect(br.x + 0.5, br.y + 0.5, br.w - 1, br.h - 1);
        } else {
          ctx.fillStyle = br.color;
          ctx.fillRect(br.x, br.y, br.w, br.h);
        }
      });

      // 패들 렌더링
      ctx.save();
      ctx.fillStyle = buffs.giantPaddle > 0 ? '#00ff87' : paddle.color;
      ctx.shadowColor = ctx.fillStyle;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.width, paddle.height, 6);
      ctx.fill();

      // 패들 광택
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      ctx.fillRect(paddle.x + 6, paddle.y + 2, paddle.width - 12, 2.5);
      ctx.restore();

      // 공 렌더링 (관통볼 여부에 따른 효과)
      const isFireball = buffs.fireball > 0;
      balls.forEach(ball => {
        ctx.save();
        ctx.fillStyle = isFireball ? '#ff3300' : '#ffffff';
        ctx.shadowColor = isFireball ? '#ff1100' : '#00f2fe';
        ctx.shadowBlur = isFireball ? 20 : 12;
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, isFireball ? ball.radius + 1.5 : ball.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 아이템 드롭 렌더링
      items.forEach(it => {
        ctx.save();
        ctx.fillStyle = it.info.color;
        ctx.shadowColor = it.info.color;
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(it.x, it.y, it.radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.font = '11px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(it.info.icon, it.x, it.y + 1);
        ctx.restore();
      });

      // 파티클 렌더링
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 대기 중 발사 안내
      if (balls.some(b => b.stuck) && gameState === 'PLAYING') {
        ctx.save();
        ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
        ctx.font = '13px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('클릭 또는 스페이스바를 눌러 발사!', canvas.width / 2, paddle.y - 25);
        ctx.restore();
      }
    }

    function gameLoop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      update(dt);
      draw();
      requestAnimationFrame(gameLoop);
    }

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
